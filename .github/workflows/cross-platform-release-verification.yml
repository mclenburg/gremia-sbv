name: Cross-platform release verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "electron/**"
      - "services/**"
      - "companion-app/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify-android:
    name: Verify Android companion
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'
      - name: Install desktop interoperability dependencies
        run: npm ci
      - name: Test, lint and build without release credentials or upload
        run: ./companion-app/android/gradlew -p companion-app/android --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug

  verify-platform:
    name: Verify ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            label: Ubuntu AppImage
            os: ubuntu-latest
            package_script: build:package:linux
            platform_check: release:platform:linux
          - platform: windows
            label: Windows
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux runtime and packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools xvfb libgtk-3-0 libnss3 libasound2t64

      - name: Install dependencies
        run: npm ci

      - name: Verify native SQLCipher binding
        run: npm run native:diagnose

      - name: Run shared security, license and build quality gates
        run: npm run build:quality

      - name: Compile application
        run: npm run build:compile

      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        run: npm run ${{ matrix.package_script }}

      - name: Package Windows portable EXE for pull requests
        if: matrix.platform == 'windows' && github.event_name == 'pull_request'
        run: npm run build:package:windows-portable

      - name: Package Windows portable EXE + MSI for manual artifact refresh
        if: matrix.platform == 'windows' && github.event_name == 'workflow_dispatch'
        run: npm run build:package:windows

      - name: Run Windows portable startup and path/backup checks for pull requests
        if: matrix.platform == 'windows' && github.event_name == 'pull_request'
        run: npm run release:platform:windows-portable

      - name: Run Windows release artifact, startup and path/backup checks for manual artifact refresh
        if: matrix.platform == 'windows' && github.event_name == 'workflow_dispatch'
        run: npm run release:platform:windows

      - name: Run packaged startup and path/backup checks under Xvfb
        if: matrix.platform == 'linux'
        run: xvfb-run -a npm run ${{ matrix.platform_check }}

      - name: Install isolated Playwright tools and Chromium
        if: matrix.platform == 'linux'
        run: npm run test:e2e:setup

      - name: Run browser E2E tests
        if: matrix.platform == 'linux'
        env:
          GREMIA_SBV_E2E_WORKERS: '2'
        run: npm run test:e2e

      - name: Run packaged product E2E tests
        if: matrix.platform == 'linux'
        run: xvfb-run -a npm run test:e2e:full-product:reuse

      - name: Upload verified release artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gremia-sbv-${{ matrix.platform }}-${{ github.sha }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.msi
          if-no-files-found: error
          retention-days: 7
