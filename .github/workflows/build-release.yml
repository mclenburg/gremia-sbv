name: Build tagged release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new release tag to build/update, e.g. v0.9.6"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: tagged-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          if [[ "${package_version}" != "${tag_version}" ]]; then
            echo "Release tag version ${tag_version} does not match package.json version ${package_version}" >&2
            exit 1
          fi

          prerelease="false"
          if [[ "${tag_version}" =~ (alpha|beta|rc) ]]; then
            prerelease="true"
          fi

          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

  quality-gates:
    name: Run release quality gates
    runs-on: ubuntu-latest
    needs: verify-tag
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Audit production and build dependencies
        run: npm run security:audit

      - name: Generate third-party license inventory
        run: npm run licenses:generate

      - name: Verify third-party license inventory
        run: npm run licenses:check

      - name: Run RC, coverage and build gates
        run: npm run build:verify

  prepare-release:
    name: Prepare draft GitHub release
    runs-on: ubuntu-latest
    needs:
      - verify-tag
      - quality-gates
    timeout-minutes: 10
    steps:
      - name: Create draft release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_VERSION: ${{ needs.verify-tag.outputs.package_version }}
          IS_PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; verified assets will be replaced in place."
            exit 0
          fi

          release_args=(
            "${RELEASE_TAG}"
            --repo "${GH_REPO}"
            --draft
            --title "Gremia.SBV ${PACKAGE_VERSION}"
            --notes "Automatisch vorbereiteter Draft-Release für ${RELEASE_TAG}."
          )
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"

  build-artifacts:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs:
      - verify-tag
      - quality-gates
      - prepare-release
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            label: Linux AppImage
            os: ubuntu-latest
          - platform: windows
            label: Windows portable + setup EXE
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Compile application once for this platform
        run: npm run build:compile

      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        run: node scripts/build-platform.cjs linux

      - name: Verify Linux artifact, desktop startup, paths and backup/restore
        if: matrix.platform == 'linux'
        run: xvfb-run -a npm run release:platform:linux

      - name: Package Windows portable + setup EXE
        if: matrix.platform == 'windows'
        run: node scripts/build-platform.cjs win

      - name: Verify Windows artifacts, portable startup, paths and backup/restore
        if: matrix.platform == 'windows'
        run: npm run release:platform:windows

      - name: Replace Linux asset in release
        if: matrix.platform == 'linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" release/*.AppImage --clobber --repo "${GH_REPO}"

      - name: Replace Windows assets in release
        if: matrix.platform == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_VERSION: ${{ needs.verify-tag.outputs.package_version }}
        run: |
          set -euo pipefail

          legacy_asset="Gremia.SBV-${PACKAGE_VERSION}-win-x64.exe"
          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" --json assets \
            --jq '.assets[].name' | grep -Fxq "${legacy_asset}"; then
            echo "Removing legacy Windows asset ${legacy_asset}"
            gh release delete-asset "${RELEASE_TAG}" "${legacy_asset}" --yes --repo "${GH_REPO}"
          fi

          gh release upload "${RELEASE_TAG}" \
            release/*.exe \
            --clobber \
            --repo "${GH_REPO}"
