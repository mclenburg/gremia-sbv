name: Sign Windows EXE with SignPath

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label passed to SignPath, for example 1.0.0
        required: true
        type: string
      build_unsigned:
        description: Build the unsigned Windows EXE before submitting it to SignPath
        required: true
        default: true
        type: boolean
      artifact_glob:
        description: Unsigned EXE glob to submit if build_unsigned is false
        required: true
        default: dist/*.exe
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: signpath-windows-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-unsigned:
    name: Prepare unsigned Windows EXE
    if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      SIGNPATH_UNSIGNED_DIR: signpath-unsigned
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate SignPath workflow contract
        run: node scripts/check-signpath-readiness.cjs
      - name: Install dependencies
        if: ${{ inputs.build_unsigned }}
        run: npm ci
      - name: Build unsigned Windows EXE
        if: ${{ inputs.build_unsigned }}
        run: npm run build:win
      - name: Prepare unsigned EXE artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = $env:SIGNPATH_UNSIGNED_DIR
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          New-Item -ItemType Directory -Path $target | Out-Null
          $glob = '${{ inputs.artifact_glob }}'
          $files = Get-ChildItem -Path $glob -File -ErrorAction SilentlyContinue
          if (-not $files -or $files.Count -eq 0) {
            throw "No unsigned EXE matched '$glob'."
          }
          foreach ($file in $files) {
            Copy-Item -Path $file.FullName -Destination (Join-Path $target $file.Name)
          }
      - name: Upload unsigned EXE
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gremia-sbv-windows-exe-unsigned
          path: signpath-unsigned/*.exe
          if-no-files-found: error
          retention-days: 7

  signpath-windows-exe:
    name: Submit Windows EXE to SignPath
    needs: prepare-unsigned
    if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: signpath-production
    env:
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'windows-exe' }}
    steps:
      - name: Download unsigned EXE
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gremia-sbv-windows-exe-unsigned
          path: signpath-unsigned
      - name: Re-upload unsigned EXE for SignPath
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gremia-sbv-windows-exe-signing-input
          path: signpath-unsigned/*.exe
          if-no-files-found: error
          retention-days: 1
      - name: Submit signing request to SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath-signed
          parameters: |
            version: ${{ toJSON(inputs.version) }}
      - name: Upload signed EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gremia-sbv-windows-exe-signed
          path: signpath-signed/**/*
          if-no-files-found: error
          retention-days: 30
